<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Chat</title>
<style>
:root{--bg:#0e1014;--panel:#151821;--raise:#1c2029;--line:#262b38;--text:#e9eaf0;--dim:#8a90a2;--accent:#8b7bff;--accent2:#c084fc;--danger:#f08080;--ok:#5fd6a0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 Inter,"Segoe UI",system-ui,sans-serif;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 12px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#side{width:280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px;font-weight:650;font-size:17px}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:15px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dim);margin-left:auto}
#dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}#dot.bad{background:var(--danger)}
#newBtn{margin:0 12px 12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:600;padding:10px}
#newBtn:hover{filter:brightness(1.1)}
#list{flex:1;overflow:auto;padding:0 8px 8px}
.conv{display:flex;align-items:center;gap:2px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--dim)}
.conv:hover{background:var(--raise);color:var(--text)}
.conv.on{background:var(--raise);color:var(--text);box-shadow:inset 3px 0 var(--accent)}
.conv span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv button{border:0;background:none;padding:2px 6px;color:var(--dim);display:none}
.conv:hover button,.conv.on button{display:block}
.conv button:hover{color:var(--accent)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
#top select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:200px;max-width:50vw}
#menu{display:none}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;background:#241f45;color:#b8adff;border:1px solid #3a3380}
.tog{font-size:13px}.tog.on{border-color:var(--accent);color:#c4bbff}
#spacer{flex:1}
#prog{position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden;opacity:0;transition:opacity .2s}
#prog.on{opacity:1}
#prog::after{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:slide 1.1s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
#set{display:none;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);gap:12px;flex-wrap:wrap}
#set.open{display:flex}
#set label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim);flex:1;min-width:220px}
#set input,#set textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;resize:vertical}
#msgs{flex:1;overflow:auto;padding:24px 16px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:12px;min-width:0}
.msg.user{justify-content:flex-end}
.msg.user .body{background:var(--raise);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:9px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.av{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex-shrink:0;display:grid;place-items:center;font-size:14px;margin-top:2px}
.msg.assistant .col{flex:1;min-width:0}
.body{overflow-wrap:anywhere}
.body p{margin:0 0 10px}.body p:last-child{margin:0}
.body code{background:#0a0c10;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font:13px Consolas,monospace}
.body pre{background:#0a0c10;border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:auto;margin:10px 0;position:relative}
.body pre code{border:0;padding:0;background:none}
.body h1,.body h2,.body h3,.body h4,.body h5,.body h6{margin:14px 0 6px;line-height:1.3}
.body h1{font-size:1.5em}.body h2{font-size:1.3em}.body h3{font-size:1.15em}.body h4,.body h5,.body h6{font-size:1em}
.body ul,.body ol{margin:0 0 10px;padding-inline-start:24px}
.body li{margin:2px 0}
.body blockquote{margin:0 0 10px;padding:4px 12px;border-inline-start:3px solid var(--accent);color:var(--dim)}
.body hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.body a{color:#a99cff}
.body .tw{overflow:auto;margin:0 0 10px}
.body table{border-collapse:collapse;font-size:14px}
.body th,.body td{border:1px solid var(--line);padding:5px 10px;text-align:start}
.body th{background:var(--raise)}
.intr{margin-top:8px;font-size:13px;color:var(--dim)}
.intr button{margin-left:8px;font-size:12px;padding:2px 10px}
.cp{position:absolute;top:6px;right:6px;font-size:12px;padding:1px 8px;opacity:.75}
.think{margin-bottom:10px;border:1px solid #2f2b57;background:#17152b;border-radius:12px;font-size:13.5px;color:#b9b4dc}
.think summary{cursor:pointer;padding:7px 12px;display:flex;align-items:center;gap:8px;list-style:none}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"▸";transition:transform .15s}
.think[open] summary::before{transform:rotate(90deg)}
.think .tt{white-space:pre-wrap;padding:0 12px 10px;color:#9d98c6}
.think.live .tt{display:flex;flex-direction:column-reverse;max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
[hidden]{display:none!important}
#jump{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);border-radius:99px;padding:6px 14px;box-shadow:0 4px 14px #0008;z-index:2}
.think.live summary .lbl{background:linear-gradient(90deg,#8a84c0,#e0dbff,#8a84c0);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.conv.gen::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite ease-in-out;flex-shrink:0;margin-right:6px}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}
.cursor::after{content:"";display:inline-block;width:8px;height:15px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.empty{text-align:center;margin-top:16vh}
.empty h2{font-size:26px;margin:14px 0 6px}.empty p{color:var(--dim);margin:0}
.empty .logo{width:52px;height:52px;font-size:26px;margin:auto;border-radius:16px}
.err{color:var(--danger)}
#bar{padding:12px 16px 18px}
.box{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
.box:focus-within{border-color:var(--accent)}
#att{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px 6px;font-size:13px}
.chip img{width:36px;height:36px;object-fit:cover;border-radius:7px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;padding:0 4px;color:var(--dim)}
#attach{background:none;border:0;padding:0 8px;height:40px;font-size:18px}
#inp{flex:1;background:none;border:0;resize:none;outline:0;padding:8px 10px;max-height:200px;min-height:24px}
#send{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:600;height:40px;padding:0 18px;border-radius:12px}
#send.stop{background:var(--danger)}
@media(max-width:700px){
#side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}
#side.open{transform:none}#menu{display:block}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">🦙</div>Ollama Chat<span id="dot"></span></div>
  <button id="newBtn">+ New chat</button>
  <div id="list"></div>
</aside>
<div id="main">
  <div id="prog"></div>
  <div id="top">
    <button id="menu" aria-label="Menu">☰</button>
    <select id="model" aria-label="Model"><option>Loading models…</option></select>
    <button id="refresh" title="Refresh models">↻</button>
    <button id="alias" title="Set nickname for this model">✎ Nickname</button>
    <span class="badge" id="cap" hidden>thinking</span>
    <button class="tog on" id="thinkTog" hidden>Think: on</button>
    <div id="spacer"></div>
    <button id="gear">⚙ Settings</button>
  </div>
  <div id="set">
    <label>Ollama server URL<input id="host" value="http://localhost:11434"></label>
    <label>Context window (num_ctx tokens)<input id="ctx" type="number" min="512" step="512"></label>
    <label>System prompt (this chat)<textarea id="sys" rows="1" placeholder="e.g. Answer concisely."></textarea></label>
  </div>
  <button id="jump" hidden aria-label="Scroll to latest">↓ Latest</button>
  <div id="msgs"><div class="wrap" id="chat"></div></div>
  <div id="bar"><div class="box">
    <div id="att" hidden></div>
    <button id="attach" title="Attach file" aria-label="Attach file">📎</button>
    <input id="file" type="file" multiple hidden>
    <textarea id="inp" rows="1" placeholder="Message… (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send">Send</button>
  </div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let S={convs:[],cur:null,host:'http://localhost:11434',think:true,alias:{},ctx:4096};
const gens={};let names=[];const caps={};
const lbl=n=>S.alias[n]||n;
function fillOpts(keep){
  const sel=$('model');
  sel.innerHTML=names.map(n=>'<option value="'+esc(n)+'" title="'+esc(n)+'">'+esc(lbl(n))+'</option>').join('')||'<option value="">No models installed</option>';
  if(keep&&names.includes(keep))sel.value=keep;
}
function load(){try{const d=JSON.parse(localStorage.getItem('ollama-ui')||'null');if(d)S=Object.assign(S,d)}catch(e){}}
let saveWarned=false;
function save(){try{localStorage.setItem('ollama-ui',JSON.stringify(S));saveWarned=false}catch(e){if(!saveWarned){saveWarned=true;alert('Browser storage is full, so chats are not being saved. Delete old chats or attachments.')}}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cur=()=>S.convs.find(c=>c.id===S.cur);
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function inl(t){
  const codes=[];
  t=t.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"'<>]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g,(m,x,y)=>'<b>'+(x||y)+'</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')
    .replace(/~~([^~]+)~~/g,'<s>$1</s>');
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[i]+'</code>');
}
function blocks(t){
  const L=t.split('\n');let h='',i=0,m;
  const row=l=>/^\s*\|.*\|\s*$/.test(l),UL=/^\s*[-*+]\s+/,OL=/^\s*\d+[.)]\s+/,BQ=/^&gt;\s?/;
  const list=(re,tag)=>{const it=[];while(i<L.length&&re.test(L[i]))it.push(L[i++].replace(re,''));return '<'+tag+'>'+it.map(x=>'<li dir="auto">'+inl(x)+'</li>').join('')+'</'+tag+'>'};
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(m=l.match(/^(#{1,6})\s+(.*)$/)){h+='<h'+m[1].length+' dir="auto">'+inl(m[2])+'</h'+m[1].length+'>';i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)&&!UL.test(l)){h+='<hr>';i++;continue}
    if(BQ.test(l)){const q=[];while(i<L.length&&BQ.test(L[i]))q.push(L[i++].replace(BQ,''));h+='<blockquote dir="auto">'+inl(q.join('<br>'))+'</blockquote>';continue}
    if(UL.test(l)){h+=list(UL,'ul');continue}
    if(OL.test(l)){h+=list(OL,'ol');continue}
    if(row(l)&&i+1<L.length&&row(L[i+1])&&/^[\s|:-]+$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>inl(x.trim()));
      const head=cells(l);i+=2;const rows=[];while(i<L.length&&row(L[i]))rows.push(cells(L[i++]));
      h+='<div class="tw"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
    const para=[];
    do{para.push(L[i++])}while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|\s*[-*+]\s|\s*\d+[.)]\s|&gt;)/.test(L[i]));
    h+='<p dir="auto">'+inl(para.join('<br>'))+'</p>';
  }
  return h;
}
function md(t){
  return t.split(/```/).map((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');const code=nl>=0?p.slice(nl+1):p;return '<pre><button class="cp">Copy</button><code>'+esc(code.replace(/\n$/,''))+'</code></pre>'}
    return blocks(esc(p));
  }).join('');
}
// split inline <think> tags (older reasoning models) from the answer
function split(raw,thinking){
  let t=thinking||'',c=raw;
  const m=c.match(/<think>([\s\S]*?)(<\/think>|$)/);
  if(m){t+=m[1];c=c.replace(m[0],'');}
  return {t:t.trim(),c:c.trim(),open:!!m&&!m[2]};
}
function newConv(){
  const c={id:uid(),title:'New chat',model:$('model').value||'',sys:'',messages:[]};
  S.convs.unshift(c);S.cur=c.id;save();renderAll();$('inp').focus();
}
function renderList(){
  $('list').innerHTML='';
  S.convs.forEach(c=>{
    const d=document.createElement('div');d.className='conv'+(c.id===S.cur?' on':'')+(gens[c.id]?' gen':'');
    d.innerHTML='<span></span><button title="Rename">✎</button><button title="Delete">✕</button>';
    d.firstChild.textContent=c.title;
    d.onclick=()=>{S.cur=c.id;save();$('side').classList.remove('open');renderAll()};
    const [,ren,del]=d.children;
    ren.onclick=e=>{e.stopPropagation();const n=prompt('Rename chat:',c.title);if(n&&n.trim()){c.title=n.trim();save();renderList()}};
    del.onclick=e=>{e.stopPropagation();if(!confirm('Delete this chat?'))return;gens[c.id]?.ctrl.abort();
      S.convs=S.convs.filter(x=>x!==c);if(S.cur===c.id)S.cur=S.convs[0]?.id||null;
      if(!S.cur)return newConv();save();renderAll()};
    $('list').appendChild(d);
  });
}
function fillAssistant(el,raw,thinking,secs,live){
  let st=el._st;
  if(!st){
    el.innerHTML='<details class="think" hidden><summary><span class="lbl"></span></summary><div class="tt"></div></details><div class="body" hidden></div><div class="dots" hidden><i></i><i></i><i></i></div>';
    const [d,body,dots]=el.children;
    st=el._st={d,body,dots,lbl:d.querySelector('.lbl'),tt:d.querySelector('.tt'),tl:null,bl:null,manual:false,closed:false};
    d.querySelector('summary').addEventListener('click',()=>{st.manual=true});
  }
  const {t,c,open}=split(raw,thinking);
  const active=live&&(open||!c);
  st.d.hidden=!t;
  st.d.classList.toggle('live',active);
  st.lbl.textContent=active?'Thinking…':(secs?'Thought for '+secs+'s':'Thoughts');
  if(t!==st.tl){st.tt.textContent=t;st.tl=t}
  if(!st.manual){if(active)st.d.open=true;else if(c&&!st.closed){st.d.open=false;st.closed=true}}
  if(c!==st.bl){st.body.innerHTML=md(c);st.bl=c}
  st.body.hidden=!c;st.body.classList.toggle('cursor',live&&!!c);
  st.dots.hidden=!(live&&!t&&!c);
}
function bubble(m,last){
  const d=document.createElement('div');d.className='msg '+m.role;
  if(m.role==='user'){const b=document.createElement('div');b.className='body';b.dir='auto';(m.atts||[]).forEach(a=>b.appendChild(attEl(a)));b.appendChild(document.createTextNode(m.content));d.appendChild(b)}
  else{d.innerHTML='<div class="av">🦙</div><div class="col"></div>';fillAssistant(d.lastChild,m.content,m.thinking,m.secs,false);
    if(m.partial&&last){const n=document.createElement('div');n.className='intr';n.innerHTML='Interrupted by a page refresh. <button class="rg">Regenerate</button>';d.lastChild.appendChild(n)}}
  $('chat').appendChild(d);return d.querySelector('.col')||d;
}
function renderChat(){
  const c=cur();$('chat').innerHTML='';
  if(!c||!c.messages.length)$('chat').innerHTML='<div class="empty"><div class="logo">🦙</div><h2>What can I help with?</h2><p>'+esc(lbl($('model').value)||'Pick a model to begin')+'</p></div>';
  else c.messages.forEach((m,i)=>bubble(m,i===c.messages.length-1));
  const g=c&&gens[c.id];
  if(g){const w=document.createElement('div');w.className='msg assistant';w.innerHTML='<div class="av">🦙</div><div class="col"></div>';$('chat').appendChild(w);g.out=w.lastChild;fillAssistant(g.out,g.acc,g.th,0,true)}
  scrollEnd();
}
function renderAll(){
  const c=cur();
  if(c&&c.model&&[...$('model').options].some(o=>o.value===c.model))$('model').value=c.model;
  $('sys').value=c?.sys||'';$('inp').value=c?.draft||'';autosize();
  renderList();renderChat();renderAtt();updateCap();updateBtn();
}
// attachments: {name, kind:'image'|'text', data} — images are JPEG data URLs, text is the file content
const pend=()=>{const c=cur();if(!c)return[];return c.draftAtt||(c.draftAtt=[])};
function attEl(a,rm){
  const e=document.createElement('span');e.className='chip';
  if(a.kind==='image'){const i=document.createElement('img');i.src=a.data;i.alt=a.name;e.appendChild(i)}
  else e.appendChild(document.createTextNode('📄'));
  const n=document.createElement('span');n.textContent=a.name;e.appendChild(n);
  if(rm){const b=document.createElement('button');b.textContent='✕';b.title='Remove';b.onclick=rm;e.appendChild(b)}
  return e;
}
function renderAtt(){
  const list=pend(),box=$('att');box.innerHTML='';
  list.forEach((a,i)=>box.appendChild(attEl(a,()=>{list.splice(i,1);save();renderAtt()})));
  box.hidden=!list.length;
}
const MAX_TEXT=100000;
// images are scaled to 1024px and re-encoded as JPEG to keep chat storage small
function toJpeg(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      if(!img.naturalWidth){URL.revokeObjectURL(url);return rej(new Error('not a readable image'))}
      const k=Math.min(1,1024/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.85))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('not a readable image'))};
    img.src=url;
  });
}
async function addFiles(files){
  if(!cur())newConv();
  const list=pend();
  for(const f of files){
    try{
      if(f.type.startsWith('image/'))list.push({name:f.name,kind:'image',data:await toJpeg(f)});
      else if(f.size>MAX_TEXT)alert(f.name+' is too large. Text files are limited to 100 KB.');
      else{const t=await f.text();
        if(t.includes('\u0000'))alert(f.name+' is a binary file. Only text, code and images can be attached.');
        else list.push({name:f.name,kind:'text',data:t})}
    }catch(e){alert('Could not read '+f.name+': '+e.message)}
  }
  save();renderAtt();
}
// Ollama takes images as bare base64 in `images`; text files go into the message body
function apiMsg(m){
  const parts=[m.content,...(m.atts||[]).filter(a=>a.kind==='text').map(a=>'File: '+a.name+'\n```\n'+a.data+'\n```')];
  const o={role:m.role,content:parts.filter(Boolean).join('\n\n')};
  const imgs=(m.atts||[]).filter(a=>a.kind==='image').map(a=>a.data.slice(a.data.indexOf(',')+1));
  if(imgs.length)o.images=imgs;
  return o;
}
function updateBtn(){const b=!!gens[S.cur];$('send').textContent=b?'Stop':'Send';$('send').classList.toggle('stop',b);$('prog').classList.toggle('on',Object.keys(gens).length>0)}
function scrollEnd(){const m=$('msgs');m.scrollTop=m.scrollHeight;updJump()}
function updJump(){const m=$('msgs');$('jump').hidden=m.scrollHeight-m.scrollTop-m.clientHeight<200}
async function canThink(model){
  if(!model)return false;
  if(model in caps)return caps[model];
  try{const r=await fetch(S.host+'/api/show',{method:'POST',body:JSON.stringify({model})});const j=await r.json();caps[model]=(j.capabilities||[]).includes('thinking')}
  catch(e){caps[model]=false}
  return caps[model];
}
async function updateCap(){
  const ok=await canThink($('model').value);
  $('cap').hidden=!ok;$('thinkTog').hidden=!ok;
  $('thinkTog').textContent='Think: '+(S.think?'on':'off');$('thinkTog').classList.toggle('on',S.think);
}
async function loadModels(){
  const sel=$('model');
  try{
    const j=await (await fetch(S.host+'/api/tags')).json();
    names=(j.models||[]).map(m=>m.name);
    $('dot').className='ok';
    fillOpts(cur()?.model);
    renderChat();updateCap();
  }catch(e){
    sel.innerHTML='<option value="">Not connected</option>';$('dot').className='bad';
    $('chat').innerHTML='<div class="empty"><div class="logo">🦙</div><h2 class="err">Can’t reach Ollama</h2><p>Check that it is running at '+esc(S.host)+'.<br>If this page was opened from a file, start Ollama with OLLAMA_ORIGINS="*".</p></div>';
  }
}
async function send(){
  let c=cur();
  if(c&&gens[c.id]){gens[c.id].ctrl.abort();return}
  const txt=$('inp').value.trim();if(!txt&&!pend().length)return;
  const model=$('model').value;if(!model){alert('Pick a model first.');return}
  if(!c){newConv();c=cur()}
  c.model=model;
  if(!c.messages.length)c.title=(txt||c.draftAtt[0].name).slice(0,40);
  const u={role:'user',content:txt};if(c.draftAtt?.length)u.atts=c.draftAtt.splice(0);
  c.messages.push(u);
  const g=gens[c.id]={acc:'',th:'',t0:Date.now(),tEnd:0,ls:0,ctrl:new AbortController(),out:null};
  c.draft='';$('inp').value='';autosize();save();renderList();renderChat();renderAtt();updateBtn();
  const msgs=(c.sys?[{role:'system',content:c.sys}]:[]).concat(c.messages.map(apiMsg));
  const think=await canThink(model);
  const body={model,messages:msgs,stream:true};if(think)body.think=S.think;
  let raf=0;const paint=()=>{raf=0;if(g.out&&g.out.isConnected){const m=$('msgs'),near=m.scrollHeight-m.scrollTop-m.clientHeight<80;fillAssistant(g.out,g.acc,g.th,0,true);if(S.cur===c.id){if(near)scrollEnd();else updJump()}}};
  try{
    const r=await fetch(S.host+'/api/chat',{method:'POST',signal:g.ctrl.signal,body:JSON.stringify(body)});
    if(!r.ok)throw new Error((await r.text())||r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){if(!l.trim())continue;
        const j=JSON.parse(l);if(j.error)throw new Error(j.error);
        g.th+=j.message?.thinking||'';g.acc+=j.message?.content||'';
        if(g.acc&&!g.tEnd)g.tEnd=Date.now();
        if(Date.now()-g.ls>1000){c.pending={acc:g.acc,th:g.th};save();g.ls=Date.now()}
        if(!raf)raf=requestAnimationFrame(paint)}
    }
  }catch(e){
    if(e.name!=='AbortError'){g.acc+=(g.acc?'\n\n':'')+'Error: '+e.message}
  }
  if(raf)cancelAnimationFrame(raf);
  const secs=(split(g.acc,g.th).t)?Math.max(1,Math.round(((g.tEnd||Date.now())-g.t0)/1000)):0;
  if(g.acc||g.th)c.messages.push({role:'assistant',content:g.acc,thinking:g.th,secs});
  delete gens[c.id];delete c.pending;
  save();renderList();
  if(S.cur===c.id){renderChat();scrollEnd()}
  updateBtn();
}
function autosize(){const t=$('inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,200)+'px'}
$('inp').addEventListener('input',()=>{autosize();const c=cur();if(c){c.draft=$('inp').value;save()}});
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('send').onclick=send;
$('attach').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('jump').onclick=scrollEnd;
$('msgs').addEventListener('scroll',updJump,{passive:true});
$('newBtn').onclick=newConv;
$('menu').onclick=()=>$('side').classList.toggle('open');
$('gear').onclick=()=>$('set').classList.toggle('open');
$('ctx').value=S.ctx;
$('ctx').onchange=e=>{S.ctx=Math.max(512,parseInt(e.target.value)||4096);e.target.value=S.ctx;save()};
$('refresh').onclick=loadModels;
$('alias').onclick=()=>{
  const m=$('model').value;if(!m)return;
  const n=prompt('Nickname for '+m+' (empty to clear):',S.alias[m]||'');
  if(n===null)return;
  if(n.trim())S.alias[m]=n.trim();else delete S.alias[m];
  save();fillOpts(m);if(!cur()?.messages.length)renderChat();
};
$('thinkTog').onclick=()=>{S.think=!S.think;save();updateCap()};
$('host').onchange=e=>{S.host=e.target.value.replace(/\/+$/,'');save();for(const k in caps)delete caps[k];loadModels()};
$('sys').onchange=e=>{const c=cur();if(c){c.sys=e.target.value;save()}};
$('model').onchange=e=>{const c=cur();if(c){c.model=e.target.value;save()}updateCap();if(!cur()?.messages.length)renderChat()};
$('chat').addEventListener('click',e=>{
  if(e.target.classList.contains('cp')){
    navigator.clipboard?.writeText(e.target.parentNode.querySelector('code').textContent);
    e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy',1200)}
});
$('chat').addEventListener('click',e=>{
  if(!e.target.classList.contains('rg'))return;
  const c=cur();if(!c||gens[c.id])return;
  c.messages.pop();const u=c.messages.pop();
  if(u&&u.role==='user'){$('inp').value=u.content;if(u.atts)c.draftAtt=u.atts.slice();send()}
});
load();
S.convs.forEach(c=>{if(c.pending){if(c.pending.acc||c.pending.th)c.messages.push({role:'assistant',content:c.pending.acc,thinking:c.pending.th,secs:0,partial:true});delete c.pending}});
save();$('host').value=S.host;
if(!S.convs.length)newConv();else if(!cur())S.cur=S.convs[0].id;
renderAll();loadModels();
</script>
